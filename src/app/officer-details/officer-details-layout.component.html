<mat-drawer-container [hasBackdrop]="false" class="officer-details-layout-container" role="navigation">
      <mat-drawer opened class="drawer-container" [mode]="'side'">
        <div class="drawer-image-container">
            <img src="/e-dossier.jpg" class="drawer-image"/>
        </div>
          <mat-divider></mat-divider>
          <div class="router-container">
              <div class="nav-item" [routerLink]="['personal-information']" routerLinkActive="active">
                <div class="nav-icon">👤</div>
                <h3>Personal Information</h3>
              </div>
              <div class="nav-item" [routerLink]="['academics']" routerLinkActive="active">
                <div class="nav-icon">🎓</div>
                <h3>Academics</h3>
              </div>
              <div class="nav-item" [routerLink]="['discipline']" routerLinkActive="active">
                <div class="nav-icon">⚖️</div>
                <h3>Discipline/Observations</h3>
              </div>
              <div class="nav-item" [routerLink]="['traits-assessment']" routerLinkActive="active">
                <div class="nav-icon">📊</div>
                <h3>Traits Assessment</h3>
              </div>
              <div class="nav-item" [routerLink]="['pet']" routerLinkActive="active">
                <div class="nav-icon">🏃‍♂️</div>
                <h3>PET / Sports</h3>
              </div>
              <div class="nav-item" [routerLink]="['medical']" routerLinkActive="active">
                <div class="nav-icon">🏥</div>
                <h3>Medical Records</h3>
              </div>
              <div *ngIf="isOic" class="nav-item" [routerLink]="['ai-summary']" routerLinkActive="active">
                <div class="nav-icon">🤖</div>
                <h3>AI Summary</h3>
              </div>
          </div>
      </mat-drawer>

      <mat-drawer-content>
        <router-outlet></router-outlet>
      </mat-drawer-content>
</mat-drawer-container>
