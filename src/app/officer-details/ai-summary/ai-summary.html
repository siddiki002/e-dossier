<div class="ai-summary-container">
  <div *ngIf="loadingSummary" class="loading-container">
    <div class="loading-content">
      <mat-spinner diameter="50" strokeWidth="4"></mat-spinner>
      <div class="loading-text-wrapper">
        <h3 class="loading-title">Generating AI Summary</h3>
        <p class="loading-subtitle">Analyzing officer data and generating comprehensive report...</p>
        <div class="loading-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loadingSummary">
    <div class="ai-report-content">
      <div class="report-header">
        <div class="header-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div class="header-content">
          <h2 class="report-title">AI Performance Summary</h2>
          <p class="report-description">Comprehensive analysis and insights based on performance data</p>
        </div>
      </div>
      
      <div class="summary-content">
        <div class="content-card">
          <div class="summary-text">{{ aiSummary }}</div>
        </div>
        
        <div class="report-footer">
          <div class="ai-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <span>AI Generated Report</span>
          </div>
          <div class="generation-time">
            Generated on {{ getCurrentDate() }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
